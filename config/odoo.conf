; Odoo server configuration for LOCAL DEVELOPMENT ONLY.
; The passwords below are throw-away values for a database that only exists on
; this machine. Never reuse this file for a real deployment.
[options]

; Where Odoo looks for modules. Odoo's own modules are found automatically;
; this adds our folder (./addons on the host, mounted here by Docker Compose).
addons_path = /mnt/extra-addons

; Filestore (attachments), sessions.
data_dir = /var/lib/odoo

; PostgreSQL connection. "db" is the Compose service name: Docker's internal
; DNS resolves it to the database container.
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; Odoo 20 listens on 127.0.0.1 by default. Inside a container that means
; "this container only", so the port published by Docker could not reach it.
; 0.0.0.0 = all interfaces OF THE CONTAINER. It is still private to this PC,
; because docker-compose.yml publishes the port on the host's 127.0.0.1 only.
http_interface = 0.0.0.0
http_port = 8069

; "Master password": protects the database manager screens
; (/web/database/manager: create, duplicate, back up, drop a database).
admin_passwd = admin

; Show the database selector/manager. Fine for development.
list_db = True

; workers = 0 means one multi-threaded process. This is what you want in
; development: the auto-reloader and the debugger both expect it.
workers = 0

log_level = info
